_schema-version: 3.3.0
ID: poapplication
version: 1.0.0
description: "A simple CAP project."
parameters:
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
modules:
  - name: purchseordersappl-ui
    type: nodejs
    path: app
    parameters:
     buildpack: nodejs_buildpack
     build-parameters:
      builder: npm-ci
    requires:
    - name: srv-api
      group: destinations
      properties:
       name: srv-api
       strictSSL: true
       forwardAuthToken: true
       url: '~{srv-url}'
    - name: poapplication-auth
  - name: poapplication-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api # required by consumers of CAP services (e.g. approuter)
        properties:
          srv-url: ${default-url}
    requires:
      - name: poapplication-auth
      - name: poapplication-db

  - name: poapplication-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: poapplication-db

resources:
  - name: poapplication-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: poapplication-${org}-${space}
        tenant-mode: dedicated
        oauth2-configuration:
          credential-types:
            - "binding-secret"
            - "x509"
  - name: poapplication-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
